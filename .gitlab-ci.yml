stages:
  - build
  - push
  - deploy

variables:
  AWS_REGION:      eu-central-1
  DOPPLER_PROJECT: logs
  DOPPLER_CONFIG:  prd
  IMAGE_NAME:      todo-app
  IMAGE_TAG:       $CI_COMMIT_SHORT_SHA

.export_secrets: &export_secrets
  - doppler secrets download --no-file --format env --token $DOPPLER_TOKEN --project $DOPPLER_PROJECT --config $DOPPLER_CONFIG > /tmp/.doppler.env
  - echo "=== Lines in doppler file ==" && wc -l /tmp/.doppler.env
  - echo "=== Keys only ===" && grep -o '^[^=]*' /tmp/.doppler.env | sort
  - set -a && source /tmp/.doppler.env && set +a && rm -f /tmp/.doppler.env
  - echo "AWS_ACCOUNT_ID set=${#AWS_ACCOUNT_ID} chars"
  - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

# ── BUILD ──────────────────────────────────────────────────────────────────────
build:
  stage: build
  tags:
    - ec2
  before_script:
    - *export_secrets
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest ./services/todo-app
    - docker save $IMAGE_NAME:$IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
    - main

# ── PUSH TO ECR ────────────────────────────────────────────────────────────────
push:
  stage: push
  tags:
    - ec2
  before_script:
    - *export_secrets
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
    - aws ecr describe-repositories --repository-names $IMAGE_NAME --region $AWS_REGION
      || aws ecr create-repository --repository-name $IMAGE_NAME --region $AWS_REGION
  script:
    - docker load -i image.tar
    - docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
    - docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $ECR_REGISTRY/$IMAGE_NAME:latest
  dependencies:
    - build
  only:
    - main

# ── DEPLOY ─────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  tags:
    - ec2
  script:
    - cd /opt/projet-logs && git pull origin main
    - make deploy ENV=prd
  only:
    - main
  environment:
    name: production
    url: https://todo.yondrfit.com
