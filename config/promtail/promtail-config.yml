server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: tcp://socket-proxy:2375
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: service
        regex: "/(.*)"
        replacement: "$1"

      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service

    pipeline_stages:
      # Tente de parser le JSON (logs structurés de la todo-app)
      - json:
          expressions:
            level: level
            message: message
          drop_malformed: false

      # Extrait le niveau depuis les logs texte (postgres, traefik...)
      - regex:
          expression: '(?i)(level|lvl|severity)[:=\s"]+(?P<level>info|warn|warning|error|debug|fatal)'

      - labels:
          level:
